[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "predictability"
dynamic = ["version"]
description = "Team work predictability from epic-level deadline slip"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Dmitry" }]
keywords = ["predictability", "deadline", "slip", "forecasting"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
  "pandas>=2.0",
  "pydantic>=2.0,<3",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0,<3",
]

[project.optional-dependencies]
catboost = ["catboost>=1.2"]
gbm = ["lightgbm>=4.0"]
dev = [
  "mypy>=1.14",
  "pandas-stubs>=2.2",
  "pre-commit>=4.0",
  "pytest>=8.0",
  "pytest-cov>=6.0",
  "ruff==0.16.4",
  "types-PyYAML>=6.0",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.27",
]

[project.scripts]
predictability = "predictability.cli:main"

[project.entry-points."predictability.adapters"]
jira = "predictability.adapters.jira:JiraAdapter"
youtrack = "predictability.adapters.youtrack:YouTrackAdapter"
mock = "predictability.adapters.mock:MockAdapter"

[project.entry-points."predictability.factors"]
team_bias = "predictability.factors.team_bias:TeamBiasFactor"
capacity_calendar = "predictability.factors.capacity_calendar:CapacityCalendarFactor"
cross_team_deps = "predictability.factors.cross_team_deps:CrossTeamDepsFactor"

[project.entry-points."predictability.models"]
empirical_bayes = "predictability.models.empirical_bayes:EmpiricalBayesBackend"
quantile_catboost = "predictability.models.quantile_catboost:QuantileCatBoostBackend"
quantile_lightgbm = "predictability.models.quantile_lightgbm:QuantileLightGBMBackend"

[project.urls]
Homepage = "https://github.com/dmitrybrovka/predictability-suite"
Documentation = "specs/001-team-work-predictability/spec.md"

[tool.hatch.version]
path = "src/predictability/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/predictability"]

[tool.hatch.build.targets.sdist]
include = ["src/predictability", "tests", "LICENSE", "README.md", "docs", "mkdocs.yml"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "B",
  "D",
  "E",
  "F",
  "I",
  "N",
  "PT",
  "PTH",
  "RET",
  "RSE",
  "RUF",
  "SIM",
  "UP",
  "W",
]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
# numpy>=2.3 ships PEP 695 `type` aliases in its stubs, which mypy rejects
# outright under python_version 3.11 ("errors prevented further checking"), so
# no per-module override can suppress it. Analysing at 3.12 keeps mypy usable;
# 3.11 compatibility of our own code is enforced by ruff target-version = py311
# and by running the test suite on 3.11 in CI.
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["catboost.*", "lightgbm.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# Coverage is enforced by pre-commit and CI, not by every local run, so a
# single-file run during red-green-refactor does not fail on total coverage.
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
  "unit: fast isolated tests",
  "contract: protocol/CLI contract tests",
  "integration: multi-component flows (no live network)",
]
# Later entries win: third-party deprecations stay visible, ours are errors.
filterwarnings = [
  "error",
  "default::DeprecationWarning",
  "default::PendingDeprecationWarning",
  "error::DeprecationWarning:predictability.*",
  "error::PendingDeprecationWarning:predictability.*",
]

[tool.coverage.run]
branch = true
source = ["predictability"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
